[project]
name = "vccjudge"
version = "0.1.0"
description = "Offline judge for the Arc Virtual Cell Challenge 2026"
requires-python = ">=3.11"

# Runtime dependencies deliberately live in requirements.txt / requirements.lock.txt,
# not here. That file carries the reasoning for its one ceiling (pandas<3, for
# laptop/Kaggle/Colab/Aqua parity) and is what every tier installs from; duplicating
# the list here would create two sources of truth that drift.
#
# This file exists so `python -m vccjudge.contract` — the readiness gate CLAUDE.md
# mandates — resolves from any working directory:
#     uv pip install -e . --no-deps
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vccjudge"]
